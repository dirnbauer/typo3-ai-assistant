name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # The MCP server fork comes from a VCS repository; the job token is for the API rate limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, static analysis, unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_sqlite, gd, zip, sodium
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer ci:lint
      - run: composer ci:phpstan
      - run: composer ci:cgl
      - run: composer ci:tests:unit

  functional:
    name: PHP ${{ matrix.php }} — functional tests (MariaDB 10.11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: funcp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseName: func_test
      typo3DatabaseUsername: root
      typo3DatabasePassword: funcp
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_mysql, mysqli, gd, zip, sodium
      - run: composer install --no-interaction --no-progress
      - run: composer ci:tests:functional

  javascript:
    name: JavaScript — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
