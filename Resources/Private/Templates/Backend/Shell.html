<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />
<f:section name="Content">
    <!--
        The mount point, and nothing else. The runtime defines <shadcn-ui-shell>,
        mounts a Shadow DOM root, renders the chat rail and the app registered
        under the `app` attribute, and reads that app's props from the JSON
        script the `props-id` attribute points at.
    -->
    <shadcn-ui-shell layout="{layout}" app="{app}" props-id="{propsId}"></shadcn-ui-shell>
    <script type="application/json" id="{propsId}">{propsJson -> f:format.raw()}</script>
</f:section>
</html>
