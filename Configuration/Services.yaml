services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    Webconsulting\ShadcnUi\Chat\Attachment\Document\DocumentExtractorInterface:
      tags: ['shadcn_ui.document_extractor']

  Webconsulting\ShadcnUi\:
    resource: '../Classes/*'
    exclude:
      # Value objects, enums and exceptions — constructed, never injected.
      - '../Classes/Backend/ShadcnApp.php'
      - '../Classes/Backend/ShellLayout.php'
      - '../Classes/Chat/ChatException.php'
      - '../Classes/Chat/ErrorMessageSanitizer.php'
      - '../Classes/Chat/Api/ApiException.php'
      - '../Classes/Chat/Api/ApiRequest.php'
      - '../Classes/Chat/Api/TurnResponder.php'
      - '../Classes/Chat/Attachment/AttachmentRejectedException.php'
      - '../Classes/Chat/Domain/Conversation.php'
      - '../Classes/Chat/Domain/ConversationStatus.php'
      - '../Classes/Chat/Domain/Message.php'
      - '../Classes/Chat/Domain/MessageRole.php'
      - '../Classes/Chat/Domain/Row.php'
      - '../Classes/Chat/Http/*'
      - '../Classes/Chat/Turn/ChatContext.php'
      - '../Classes/Chat/Turn/StepRecorder.php'
      - '../Classes/Chat/Turn/TurnOutcome.php'
      - '../Classes/Chat/Turn/TurnResult.php'
      # One instance per catalogue entry, built by McpCatalogToolProvider.
      - '../Classes/Chat/Tool/McpCatalogTool.php'
      # Registered by Configuration/Services.php, and only where it is safe.
      - '../Classes/Testing/*'

  # Route and module targets are resolved through the container by name.
  Webconsulting\ShadcnUi\Backend\ShadcnModuleRenderer:
    public: true
  Webconsulting\ShadcnUi\Backend\Controller\ComponentsModuleController:
    public: true
  Webconsulting\ShadcnUi\Chat\Controller\ChatModuleController:
    public: true
  Webconsulting\ShadcnUi\Chat\Api\StatusController:
    public: true
  Webconsulting\ShadcnUi\Chat\Api\ConversationController:
    public: true
  Webconsulting\ShadcnUi\Chat\Api\TurnController:
    public: true
  Webconsulting\ShadcnUi\Chat\Api\AttachmentController:
    public: true

  cache.shadcn_ui_tools:
    class: 'TYPO3\CMS\Core\Cache\Frontend\FrontendInterface'
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      $identifier: 'shadcn_ui_tools'

  # Tagged explicitly rather than by autoconfiguration: ToolProviderInterface
  # carries an #[AutoconfigureTag], and letting both apply would register the
  # provider twice — every tool would collide with itself and be dropped.
  Webconsulting\ShadcnUi\Chat\Tool\McpCatalogToolProvider:
    autoconfigure: false
    arguments:
      $cache: '@cache.shadcn_ui_tools'
    tags:
      - name: 'nr_llm.tool_provider'

  Webconsulting\ShadcnUi\Chat\Attachment\Document\DocumentExtractorRegistry:
    arguments:
      $extractors: !tagged_iterator 'shadcn_ui.document_extractor'
