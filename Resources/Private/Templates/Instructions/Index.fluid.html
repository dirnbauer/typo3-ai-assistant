<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1>{title}</h1>
    <p class="lead"><f:translate key="intro" domain="webcon_ai_assistant.instructions" /></p>

    <f:be.infobox
        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
        title="{f:translate(key: 'scope.title', domain: 'webcon_ai_assistant.instructions')}"
    >
        <p><f:translate key="scope.body" domain="webcon_ai_assistant.instructions" /></p>
    </f:be.infobox>

    <f:if condition="{instructions}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <caption class="visually-hidden"><f:translate key="table.caption" domain="webcon_ai_assistant.instructions" /></caption>
                    <thead>
                        <tr>
                            <th scope="col"><f:translate key="table.title" domain="webcon_ai_assistant.instructions" /></th>
                            <th scope="col"><f:translate key="table.scope" domain="webcon_ai_assistant.instructions" /></th>
                            <th scope="col"><f:translate key="table.status" domain="webcon_ai_assistant.instructions" /></th>
                            <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="table.actions" domain="webcon_ai_assistant.instructions" /></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{instructions}" as="instruction">
                            <tr>
                                <td>
                                    <a href="{instruction.editUrl}" class="fw-bold">
                                        <core:iconForRecord table="tx_webconaiassistant_instruction" row="{uid: instruction.uid, hidden: instruction.hidden}" />
                                        {instruction.title}
                                    </a>
                                    <div class="text-variant"><f:format.crop maxCharacters="160" respectWordBoundaries="true">{instruction.body}</f:format.crop></div>
                                    <f:if condition="{instruction.description}">
                                        <div class="text-variant"><em>{instruction.description}</em></div>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{instruction.groups}">
                                        <f:then>
                                            <f:for each="{instruction.groups}" as="group" iteration="groupIteration">
                                                <span class="badge badge-default">{group}</span>
                                            </f:for>
                                        </f:then>
                                        <f:else>
                                            <f:translate key="scope.everyone" domain="webcon_ai_assistant.instructions" />
                                        </f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{instruction.hidden}">
                                        <f:then><span class="badge badge-default"><f:translate key="status.off" domain="webcon_ai_assistant.instructions" /></span></f:then>
                                        <f:else><span class="badge badge-success"><f:translate key="status.on" domain="webcon_ai_assistant.instructions" /></span></f:else>
                                    </f:if>
                                </td>
                                <td class="col-control nowrap">
                                    <div class="btn-group">
                                        <a class="btn btn-default" href="{instruction.editUrl}" title="{f:translate(key: 'action.edit', domain: 'webcon_ai_assistant.instructions', arguments: {title: instruction.title})}">
                                            <core:icon identifier="actions-open" size="small" />
                                            <span class="visually-hidden"><f:translate key="action.edit" domain="webcon_ai_assistant.instructions" arguments="{title: instruction.title}" /></span>
                                        </a>
                                        <f:if condition="{instruction.hidden}">
                                            <f:then>
                                                <a class="btn btn-default" href="{instruction.toggleUrl}" title="{f:translate(key: 'action.enable', domain: 'webcon_ai_assistant.instructions', arguments: {title: instruction.title})}">
                                                    <core:icon identifier="actions-edit-unhide" size="small" />
                                                    <span class="visually-hidden"><f:translate key="action.enable" domain="webcon_ai_assistant.instructions" arguments="{title: instruction.title}" /></span>
                                                </a>
                                            </f:then>
                                            <f:else>
                                                <a class="btn btn-default" href="{instruction.toggleUrl}" title="{f:translate(key: 'action.disable', domain: 'webcon_ai_assistant.instructions', arguments: {title: instruction.title})}">
                                                    <core:icon identifier="actions-edit-hide" size="small" />
                                                    <span class="visually-hidden"><f:translate key="action.disable" domain="webcon_ai_assistant.instructions" arguments="{title: instruction.title}" /></span>
                                                </a>
                                            </f:else>
                                        </f:if>
                                        <a
                                            class="btn btn-default t3js-modal-trigger"
                                            href="{instruction.deleteUrl}"
                                            title="{f:translate(key: 'action.delete', domain: 'webcon_ai_assistant.instructions', arguments: {title: instruction.title})}"
                                            data-title="{f:translate(key: 'delete.title', domain: 'webcon_ai_assistant.instructions')}"
                                            data-content="{f:translate(key: 'delete.body', domain: 'webcon_ai_assistant.instructions', arguments: {title: instruction.title})}"
                                            data-severity="warning"
                                            data-button-close-text="{f:translate(key: 'delete.cancel', domain: 'webcon_ai_assistant.instructions')}"
                                            data-button-ok-text="{f:translate(key: 'delete.confirm', domain: 'webcon_ai_assistant.instructions')}"
                                        >
                                            <core:icon identifier="actions-delete" size="small" />
                                            <span class="visually-hidden"><f:translate key="action.delete" domain="webcon_ai_assistant.instructions" arguments="{title: instruction.title}" /></span>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <p>
                <a class="btn btn-default" href="{recordsUrl}">
                    <core:icon identifier="module-list" size="small" />
                    <f:translate key="action.sortInRecords" domain="webcon_ai_assistant.instructions" />
                </a>
            </p>
        </f:then>
        <f:else>
            <div class="webcon-ai-assistant-empty-state">
                <core:icon identifier="webcon-ai-assistant-record-instruction" size="large" />
                <p><f:translate key="empty" domain="webcon_ai_assistant.instructions" /></p>
                <a class="btn btn-primary" href="{newUrl}">
                    <core:icon identifier="actions-plus" size="small" />
                    <f:translate key="action.create" domain="webcon_ai_assistant.instructions" />
                </a>
            </div>
        </f:else>
    </f:if>
</f:section>

</html>
